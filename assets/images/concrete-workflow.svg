<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-labelledby="title desc"><title id="title">Mechanical design workflow illustration</title><desc id="desc">An abstract sequence showing measure, model, verify and release, without depicting confidential production machinery.</desc><rect width="900" height="560" fill="#e8e5db"/><path d="M135 295h630" stroke="#9aa69c" stroke-width="5" stroke-dasharray="10 12"/><g fill="#f6f4ed" stroke="#294137" stroke-width="5"><circle cx="180" cy="290" r="76"/><circle cx="360" cy="290" r="76"/><circle cx="540" cy="290" r="76"/><circle cx="720" cy="290" r="76"/></g><g fill="#c65d3b"><circle cx="180" cy="290" r="16"/><circle cx="360" cy="290" r="16"/><circle cx="540" cy="290" r="16"/><circle cx="720" cy="290" r="16"/></g><path d="M160 250l40 40-40 40m160-82h80v82h-80zm160 82 40-82 40 82zm160-82h80v82h-80z" fill="none" stroke="#294137" stroke-width="5"/><text x="180" y="420" text-anchor="middle" fill="#294137" font-family="Arial,sans-serif" font-size="16" letter-spacing="2">MEASURE</text><text x="360" y="420" text-anchor="middle" fill="#294137" font-family="Arial,sans-serif" font-size="16" letter-spacing="2">MODEL</text><text x="540" y="420" text-anchor="middle" fill="#294137" font-family="Arial,sans-serif" font-size="16" letter-spacing="2">VERIFY</text><text x="720" y="420" text-anchor="middle" fill="#294137" font-family="Arial,sans-serif" font-size="16" letter-spacing="2">RELEASE</text><text x="450" y="500" text-anchor="middle" fill="#294137" font-family="Arial,sans-serif" font-size="17" letter-spacing="4">GENERALIZED WORKFLOW - NO MACHINE DETAILS</text></svg>